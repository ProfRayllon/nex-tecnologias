<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do cliente | NEX Tecnologias</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Montserrat:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/style.css?v=13">
  <link rel="stylesheet" href="/assets/css/app.css?v=13">
</head>
<body class="app">
  <main class="entrar">
    <!-- Etapa 1: e-mail e senha -->
    <form class="entrar__caixa" id="form-entrar" method="post" action="/entrar" novalidate>
      <div class="entrar__topo">
        <a href="/" class="logo" aria-label="NEX Tecnologias - site">
          <img class="logo__mark" src="/assets/img/nex-simbolo-clara-128.png" alt="" width="38" height="38">
          <span class="logo__text">NEX<small>Tecnologias</small></span>
        </a>
        <h1>Área do cliente</h1>
        <p>Entre com o acesso enviado pela NEX.</p>
      </div>
      <div class="entrar__cartao">
        <div class="entrar__erro" id="erro-entrar" role="alert"></div>
        <label class="field"><span>E-mail</span><input type="email" name="email" autocomplete="username" required placeholder="voce@empresa.com.br"></label>
        <label class="field"><span>Senha</span>
          <span class="senha">
            <input type="password" name="senha" autocomplete="current-password" required placeholder="Sua senha">
            <button type="button" class="icobtn" data-ver-senha aria-label="Mostrar senha"><svg viewBox="0 0 24 24" class="ico"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </span>
        </label>
        <button type="submit" class="btn btn--primary btn--block">Entrar <svg viewBox="0 0 24 24" class="ico"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <div class="entrar__pe">
        <a href="/"><svg viewBox="0 0 24 24" class="ico ico--volta"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Voltar ao site</a>
        <a href="mailto:contato@nextecnologias.com.br?subject=Acesso%20%C3%A0%20%C3%A1rea%20do%20cliente">Esqueci a senha</a>
      </div>
    </form>

    <!-- Etapa 2: primeira entrada, troca da senha provisória -->
    <form class="entrar__caixa" id="form-senha" method="post" action="/entrar" novalidate hidden>
      <div class="entrar__topo">
        <a href="/" class="logo" aria-label="NEX Tecnologias - site">
          <img class="logo__mark" src="/assets/img/nex-simbolo-clara-128.png" alt="" width="38" height="38">
          <span class="logo__text">NEX<small>Tecnologias</small></span>
        </a>
        <h1>Crie sua senha</h1>
        <p id="ola-senha">Este é o seu primeiro acesso. Defina uma senha pessoal para continuar.</p>
      </div>
      <div class="entrar__cartao">
        <div class="entrar__erro" id="erro-senha" role="alert"></div>
        <label class="field"><span>Nova senha</span>
          <span class="senha">
            <input type="password" name="senha" autocomplete="new-password" required minlength="8" placeholder="Pelo menos 8 caracteres">
            <button type="button" class="icobtn" data-ver-senha aria-label="Mostrar senha"><svg viewBox="0 0 24 24" class="ico"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </span>
        </label>
        <label class="field"><span>Confirme a nova senha</span><input type="password" name="confirma" autocomplete="new-password" required placeholder="Repita a senha"></label>
        <button type="submit" class="btn btn--primary btn--block">Salvar e continuar <svg viewBox="0 0 24 24" class="ico"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </form>
  </main>

  <script src="/assets/js/nex.js?v=13"></script>
  <script src="/assets/js/entrar.js?v=13"></script>
</body>
</html>
